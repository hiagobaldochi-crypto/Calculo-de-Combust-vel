<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculadora de combustível</title>
<meta name="theme-color" content="#0f6b4f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Combustível">
<style>
  :root{--bg:#f3f5f2;--surface:#fff;--ink:#1c2b24;--line:#d5dcd7;--accent:#0f6b4f;--accent-ink:#fff}
  @media (prefers-color-scheme: dark){
    :root{--bg:#141b17;--surface:#1d2722;--ink:#e8efea;--line:#33423a;--accent:#1f8a66;--accent-ink:#fff}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,sans-serif;line-height:1.5;
    padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
  main{max-width:520px;margin:0 auto;padding:24px 16px 48px}
  h1{font-size:1.5rem;margin:0 0 16px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
  label{display:block;font-weight:600;margin:12px 0 4px}
  label:first-child{margin-top:0}
  input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
  input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .resultado{background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:18px}
  .resultado .big{font-size:2.2rem;font-weight:700}
</style>
</head>
<body>
<main>
  <h1>Quanto vou gastar de combustível?</h1>

  <div class="card">
    <label for="distancia">Distância (km)</label>
    <input id="distancia" type="number" inputmode="decimal" min="0" step="any">
    <label for="consumo">Consumo do carro (km por litro)</label>
    <input id="consumo" type="number" inputmode="decimal" min="0" step="any">
    <label for="preco">Preço do litro (R$)</label>
    <input id="preco" type="number" inputmode="decimal" min="0" step="any">
  </div>

  <div id="resultado" class="resultado" hidden aria-live="polite"></div>
</main>

<script>
  var brl = new Intl.NumberFormat('pt-BR', {style: 'currency', currency: 'BRL'});
  var num = new Intl.NumberFormat('pt-BR', {maximumFractionDigits: 2});
  var $ = function (id) { return document.getElementById(id); };

  function atualizar() {
    var km = +$('distancia').value.replace(',', '.');
    var c = +$('consumo').value.replace(',', '.');
    var p = +$('preco').value.replace(',', '.');
    var box = $('resultado');
    if (!(km > 0 && c > 0 && p > 0)) { box.hidden = true; return; }
    var litros = km / c, custo = litros * p;
    box.hidden = false;
    box.innerHTML = '<div>Gasto estimado</div><div class="big">' + brl.format(custo) + '</div>' +
      '<div>' + num.format(litros) + ' litros · ' + brl.format(custo / km) + ' por km</div>';
  }

  ['distancia', 'consumo', 'preco'].forEach(function (id) {
    $(id).addEventListener('input', atualizar);
  });

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
